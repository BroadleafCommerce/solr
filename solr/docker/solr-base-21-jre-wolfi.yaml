contents:
  repositories:
    - https://repository.broadleafcommerce.com/repository/wolfi-archive/os
  packages:
    - openjdk-21-jre=21.0.10-r6
    - openjdk-21-default-jvm=21.0.10-r6
    - tzdata=2026a-r2
    - ca-certificates-bundle=20260413-r0
    - acl=2.3.2-r55
    - lsof=4.99.6-r5
    - procps=4.0.6-r2
    - wget=1.25.0-r14
    - netcat-openbsd=1.234-r2
    - gosu=1.19-r8
    - tini=0.19.0-r25
    - bash=5.3-r12
    - curl=8.19.0-r9
    - libcurl-openssl4=8.19.0-r9
    - openssl=3.6.2-r2
    - libssl3=3.6.2-r2
    - libcrypto3=3.6.2-r2
    - libpng=1.6.58-r0
    - gnutls=3.8.12-r3
    - libnghttp2-14=1.68.1-r2
    - libexpat1=2.7.5-r1
    - zlib=1.3.2-r2
    - coreutils=9.10-r5
    - iproute2=7.0.0-r0

accounts:
  groups:
    - groupname: solr
      gid: 8983
  users:
    - username: solr
      uid: 8983
      gid: 8983
  run-as: 8983

environment:
  JAVA_TOOL_OPTIONS: ""
  PATH: /opt/solr/bin:/opt/solr/docker/scripts:/opt/solr/prometheus-exporter/bin:/opt/solr/cross-dc-manager/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  SOLR_USER: "solr"
  SOLR_UID: "8983"
  SOLR_GROUP: "solr"
  SOLR_GID: "8983"
  SOLR_INCLUDE: /etc/default/solr.in.sh
  SOLR_HOME: /var/solr/data
  SOLR_PID_DIR: /var/solr
  SOLR_LOGS_DIR: /var/solr/logs
  LOG4J_PROPS: /var/solr/log4j2.xml
  SOLR_JETTY_HOST: "0.0.0.0"
  SOLR_ZK_EMBEDDED_HOST: "0.0.0.0"

paths:
  - path: /var/solr
    type: directory
    permissions: 0770
    uid: 8983
    gid: 8983
  - path: /opt/solr
    type: directory
    permissions: 0755
    uid: 8983
    gid: 8983
  - path: /docker-entrypoint-initdb.d
    type: directory
    permissions: 0755
    uid: 8983
    gid: 8983
  - path: /etc/default
    type: directory
    permissions: 0755
    uid: 8983
    gid: 8983

work-dir: /opt/solr
