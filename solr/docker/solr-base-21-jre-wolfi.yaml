contents:
  repositories:
    - https://repository.broadleafcommerce.com/repository/wolfi-archive/os
  packages:
    - wolfi-base
    - openjdk-21-jre
    - openjdk-21-default-jvm
    - tzdata
    - ca-certificates-bundle
    - acl
    - lsof
    - procps
    - wget
    - netcat-openbsd
    - gosu
    - tini
    - jattach
    - bash
    - curl

accounts:
  groups:
    - groupname: solr
      gid: 8983
  users:
    - username: solr
      uid: 8983
      gid: 8983
  run-as: 8983

environment:
  JAVA_TOOL_OPTIONS: ""
  PATH: /opt/solr/bin:/opt/solr/docker/scripts:/opt/solr/prometheus-exporter/bin:/opt/solr/cross-dc-manager/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  SOLR_USER: "solr"
  SOLR_UID: "8983"
  SOLR_GROUP: "solr"
  SOLR_GID: "8983"
  SOLR_INCLUDE: /etc/default/solr.in.sh
  SOLR_HOME: /var/solr/data
  SOLR_PID_DIR: /var/solr
  SOLR_LOGS_DIR: /var/solr/logs
  LOG4J_PROPS: /var/solr/log4j2.xml
  SOLR_JETTY_HOST: "0.0.0.0"
  SOLR_ZK_EMBEDDED_HOST: "0.0.0.0"

paths:
  - path: /var/solr
    type: directory
    permissions: 0770
    uid: 8983
    gid: 8983
  - path: /opt/solr
    type: directory
    permissions: 0755
    uid: 8983
    gid: 8983
  - path: /docker-entrypoint-initdb.d
    type: directory
    permissions: 0755
    uid: 8983
    gid: 8983
  - path: /etc/default
    type: directory
    permissions: 0755
    uid: 8983
    gid: 8983

work-dir: /opt/solr
